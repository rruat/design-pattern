<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Design Pattern</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="mHeader">
            <div id="mLogo">%</div>
            <ul id="mMenu">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
        </header>

        <nav id="mNav">
            <div class="nav-logo">%</div>
            <div class="nav-divider" aria-hidden="true"></div>
            <ul>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </nav>

        <div id="mNavDivider" aria-hidden="true"></div>

        <aside id="mAside">
            <header class="aside-header">a</header>
            <span class="aside-indicator" title="Arraste para redimensionar"><span class="indicator-dots">...</span></span>
        </aside>

        <main id="mMain">
            <section id="s1">
                <header class="section-header">
                    <span class="section-icon">%</span>
                    <span class="section-title">s1</span>
                    <button class="section-close" type="button" aria-label="Fechar s1">x</button>
                </header>
            </section>

            <section id="s2">
                <header class="section-header">
                    <span class="section-icon">%</span>
                    <span class="section-title">s2</span>
                    <button class="section-close" type="button" aria-label="Fechar s2">x</button>
                </header>
                <span class="main-indicator" title="Arraste para redimensionar ou duplo clique para alternar vertical/horizontal"><span class="indicator-dots">...</span></span>
            </section>
        </main>

        <footer id="mFooter">f</footer>

        <script src="main.js"></script>
    </body>
</html>
