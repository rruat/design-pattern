<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Design Pattern</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="mHeader">
            <div id="mLogo">%</div>
            <ul id="mMenu">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
        </header>
        <nav id="mNav">
            <div class="nav-logo">%</div>
            <div class="nav-divider" aria-hidden="true"></div>
            <ul>
                <li></li>
                <li></li>
            </ul>
        </nav>
        <div id="mNavDivider" aria-hidden="true"></div>
        <aside id="mAside">
            <header class="aside-header">a</header>
        </aside>
        <main id="mMain">
            <span class="aside-indicator">...</span>
            <section id="s1" class="panel-header">
                <header class="section-header">s1</header>
            </section>
            <section id="s2">
                <header class="section-header">s2</header>
                <span class="main-indicator">...</span>
            </section>
        </main>
        <footer id="mFooter">f</footer>

        <script src="main.js"></script>
    </body>
</html>
